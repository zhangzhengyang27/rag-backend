name: backend

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 02:00（CST）跑一次依赖安全扫描，避免只在发版前才发现漏洞
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis/redis-stack-server:7.4-v0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      DEEPSEEK_API_KEY: ci-fake-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

      - name: Print test summary on failure
        if: failure()
        run: grep -rh "Tests run" target/surefire-reports/*.txt || true

  dependency-scan:
    # 单独成 job：NVD 数据集首次下载要十几分钟且依赖 NVD_API_KEY，
    # 挂在 push/PR 上会拖慢反馈，所以只在定时与手动触发时执行。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: OWASP dependency-check
        env:
          # 没有配置 secret 时会退化为匿名下载 NVD 数据，速度慢但不会失败
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # CVSS >= 7 视为高危，直接让任务失败，避免只出报告没人看
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
