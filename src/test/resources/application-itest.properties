# 集成冒烟测试专用覆盖（@ActiveProfiles("itest")）：
# 独立 MySQL schema + 独立 Redis 索引前缀，与生产数据完全隔离；
# 关闭外部依赖（DeepSeek 用假 key、重排/查询改写/docs 启动对账关闭）。
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:3306/langchain4j_itest?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

app.jwt.secret=itest-secret-not-for-production-0123456789abcdef

app.kb.redis.index-name=kb_embeddings_itest
app.kb.redis.prefix=itest:kbdoc:
app.kb.retrieval.bm25-index-name=kb_embeddings_bm25_itest
app.kb.retrieval.rerank-enabled=false
app.kb.retrieval.min-score=0.2
app.kb.retrieval.query-rewrite-enabled=false

app.kb.docs-sync.enabled=false
app.kb.docs-sync.sync-on-startup=false
# 冒烟测试用临时目录（Files.createTempDirectory，位于 java.io.tmpdir 下）做 docs 同步，
# 导入路径白名单须放行临时目录
app.kb.import.allowed-roots=${java.io.tmpdir}

langchain4j.open-ai.chat-model.api-key=itest-noop-key
langchain4j.open-ai.streaming-chat-model.api-key=itest-noop-key
