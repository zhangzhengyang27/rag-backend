spring.application.name=lostsystem
# 本机 nginx 已占用 IPv4 的 8080 端口，应用改用 8081 避免冲突
server.port=8081
# 聊天消息经 POST body 传递（见 KbController /api/kb/chat-stream）；请求头上限由 WebServerConfig 程序化放宽（防御性）

# =====================================================================
# 安全配置：所有密钥与数据库凭据均通过环境变量注入，禁止提交明文。
# 启动前请在环境变量（或 IDE 运行配置）中配置：
#   DEEPSEEK_API_KEY  = sk-xxxx         DeepSeek API Key（必填）
#   DB_PASSWORD       = xxxx            数据库密码（必填）
#   REDIS_PASSWORD    = xxxx            可选，Redis Stack 密码
#   JWT_SECRET        = xxxx            JWT 签名密钥（HS256，至少 32 字节），必填：缺失时应用拒绝启动
# =====================================================================

# ---------- DeepSeek（OpenAI 兼容模式）聊天模型 ----------
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY:}
langchain4j.open-ai.chat-model.model-name=deepseek-chat
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

langchain4j.open-ai.streaming-chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.streaming-chat-model.api-key=${DEEPSEEK_API_KEY:}
langchain4j.open-ai.streaming-chat-model.model-name=deepseek-chat
langchain4j.open-ai.streaming-chat-model.log-requests=false
langchain4j.open-ai.streaming-chat-model.log-responses=false

# ---------- 知识库 RAG 检索配置（本地 ONNX 向量模型 + Redis Stack 向量存储） ----------
# 连接参数均支持环境变量覆盖，便于多环境/跨机部署（默认本机回退）
app.kb.redis.host=${KB_REDIS_HOST:127.0.0.1}
app.kb.redis.port=${KB_REDIS_PORT:6379}
app.kb.redis.password=${REDIS_PASSWORD:}
app.kb.redis.index-name=kb_embeddings
app.kb.redis.prefix=lostsystem:kbdoc:
# 向量化模型复用本地 ONNX 模型（bge-small-zh-v15，维度 512（中文优化））
app.kb.embedding-dimension=512
# 文档分块参数（按段落切分，适合中文 Markdown）
app.kb.chunk.max-segment-size=500
app.kb.chunk.max-overlap-size=60
# 知识库检索参数
app.kb.retrieval.max-results=4
app.kb.retrieval.min-score=0.4

# ---------- 混合检索（向量召回 + BM25 关键词召回，RRF 融合） ----------
# 向量召回候选数（先宽后精，远大于最终返回数）
app.kb.retrieval.vector-top-n=20
# BM25 关键词召回候选数（基于 RediSearch TEXT 字段：text/title/filePath）
app.kb.retrieval.bm25-top-n=20
# RRF 融合常数 k（排名越靠后惩罚越大，常用 60）
app.kb.retrieval.rrf-k=60
# 融合后最终返回给 LLM 的片段数
app.kb.retrieval.final-top-k=6
# BM25 查询是否对用户输入做轻量分词（保留中文分词，去除停用标点）
app.kb.retrieval.bm25-enabled=true
# 关键词后端：redis=RediSearch BM25（中文分词索引，词级相关度优先）；无命中/异常自动回退 MySQL LIKE。
# mysql=仅用 MySQL LIKE（代码级安全默认）。部署环境需 Redis Stack（含 RediSearch 模块）。
app.kb.retrieval.keyword-backend=redis
# BM25 补充索引名（中文分词，启动时幂等创建；默认跟随向量索引名 + _bm25）
app.kb.retrieval.bm25-index-name=kb_embeddings_bm25

# ---------- 查询改写（检索前用 DeepSeek 改写/拆解用户问题） ----------
# 关闭时直接用原 query 检索（降级）
app.kb.retrieval.query-rewrite-enabled=true
# 改写调用超时（毫秒），超时则降级为原 query
app.kb.retrieval.query-rewrite-timeout-ms=3000

# ---------- 语义重排（RRF 融合后，本地 bge-reranker INT8 ONNX 精排） ----------
# 总开关；关闭时直接用 RRF 融合结果（降级）
app.kb.retrieval.rerank-enabled=true
# bge-reranker-base INT8 量化 ONNX 模型文件路径（HuggingFace keisuke-miyako/bge-reranker-base-int8）
# 默认指向项目内 models/ 目录（相对后端进程工作目录）；多机/流水线部署用
# 环境变量 KB_RERANK_MODEL_PATH / KB_RERANK_TOKENIZER_PATH 覆盖
app.kb.retrieval.rerank-model-path=${KB_RERANK_MODEL_PATH:models/bge-reranker-base-int8/model_quantized.onnx}
# 配套 tokenizer.json 路径
app.kb.retrieval.rerank-tokenizer-path=${KB_RERANK_TOKENIZER_PATH:models/bge-reranker-base-int8/tokenizer.json}
# 参与精排的候选数（RRF 融合后取前 N 条交给精排，控制 ONNX 推理开销）
app.kb.retrieval.rerank-top-n=10

# ---------- 意图路由 + 相关度判定（RelevanceChecker 拒答） ----------
# 意图路由：非知识类问题（寒暄/指令/感谢）跳过知识库检索，直接普通对话
app.kb.retrieval.intent-routing-enabled=true
# 相关度拒答：检索融合后最高分低于阈值时，判定知识库无相关内容并拒答（抑制幻觉）
app.kb.retrieval.relevance-check-enabled=true
# 相关度阈值（对融合后最高命中分数）——知识库确有相关内容时通常远高于该值
app.kb.retrieval.relevance-min-score=0.45

# ---------- 内容安全（关键词层审核，O2） ----------
# 开关；内联敏感词（逗号分隔，可为空）；词表文件（classpath，可为空）。词表为空=不拦截不脱敏。
app.kb.safety.enabled=true
app.kb.safety.sensitive-words=
app.kb.safety.sensitive-words-file=sensitive-words.txt

# ---------- 用户认证（JWT） ----------
# JWT 密钥必须通过环境变量 JWT_SECRET 注入（HS256，至少 32 字节）；未配置时应用将拒绝启动，
# 避免任何固定/缺失密钥被用于伪造 token。生成示例：openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expire-days=7

# ---------- 管理员引导（逗号分隔的用户名，启动时自动提升为 ADMIN） ----------
app.admin.usernames=admin

# ---------- 知识库空间（公共 default / 个人 u-*） ----------
# 公共知识库空间标识
app.kb.library.public-code=default
# 个人知识库配额（0=不限制）：面向个人用户
app.kb.library.user-doc-limit=200
app.kb.library.user-retrieval-limit=200
app.kb.library.user-chat-limit=100

# ---------- 文件上传（知识库 Markdown 文档导入） ----------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# 业务侧单文件上限（上传/目录导入/同步通用，字节）：与 multipart 20MB 对齐，
# 缺省会回落到代码默认 5MB 导致大文件被静默拒绝
app.kb.import.max-file-size=20971520
# 目录导入/docs 同步的路径白名单（逗号分隔，绝对或相对路径）：
# 管理端传入的服务器路径必须落在白名单根之内；默认跟随 docs 同步根目录，
# 需要导入其他目录时用环境变量 KB_IMPORT_ALLOWED_ROOTS 显式放开
app.kb.import.allowed-roots=${KB_IMPORT_ALLOWED_ROOTS:${app.kb.docs-sync.root:../tech-codex/docs}}
# 文档在线编辑走表单体（PUT content）：Tomcat 默认 2MB 会拒绝大文档；导入类大文件仍走 multipart（20MB）
server.tomcat.max-http-form-post-size=10MB

# ---------- docs 目录自动同步（知识库内容与前端 docs 目录保持一致） ----------
# 对 docs 根做增量对账：新增/内容变更按相对路径入库与重建，改名按内容 hash 识别为移动，
# 已删除文档自动清理分块与向量；相对导入根的存量目录导入文档会被收编为受管。
# 触发模型面向"docs 仅在重新发布时变化"：启动对账一次 + 发布钩子/手动触发（POST /admin/kb/documents/sync）；
# 周期轮询默认关闭（interval-ms=0），仅开发期需要热跟随时开启。
# root 默认指向旁侧 tech-codex 前端的 docs 目录（相对后端进程工作目录），跨机部署用 KB_DOCS_ROOT 覆盖。
app.kb.docs-sync.enabled=true
app.kb.docs-sync.sync-on-startup=true
app.kb.docs-sync.root=${KB_DOCS_ROOT:../tech-codex/docs}
app.kb.docs-sync.interval-ms=0
app.kb.docs-sync.initial-delay-ms=20000
app.kb.docs-sync.library-code=default

# ---------- URL 导入安全（SSRF 防护） ----------
# 默认拒绝内网/保留地址（环回、链路本地、私网、组播等）。仅本地联调导入内网文档站时可临时开启。
app.kb.url-fetch.allow-private-hosts=false

# ---------- 登录防爆破（按用户名锁定） ----------
# 连续失败达阈值后锁定该账号；0 秒窗口等同于关闭锁定。多实例部署应替换为 Redis 计数。
app.auth.login-max-failures=5
app.auth.login-lock-seconds=600

# ---------- 知识库检索辅助缓存 ----------
# 文档信息（标题/路径/space）本地 LRU 缓存条数；文档更新/删除时自动失效
app.kb.doc-cache.max-entries=500

# ---------- 熔断器（LLM 调用保护） ----------
app.breaker.failure-threshold=5
app.breaker.cooldown-seconds=30
app.breaker.max-retries=1

# ---------- 输入校验与限流 ----------
# 单条消息最大长度（字符），防止 token 成本失控
app.limit.chat-message-max-length=1000
# 每用户每分钟对话请求配额
app.limit.chat-rate-per-minute=60
# 令牌桶突发容量
app.limit.chat-burst-capacity=20
# 分页 size 上限（防客户端请求超大分页打爆数据库）
spring.data.web.pageable.max-page-size=20
spring.data.web.pageable.default-page-size=20

# ---------- CORS（前后端分离部署时放开跨域） ----------
# 多个来源用英文逗号分隔；生产环境务必用 env CORS_ALLOWED_ORIGINS 显式配置具体域名，
# 本地开发默认放行 Next.js dev origin（localhost:4200），否则浏览器同源 fetch 携带的
# Origin 头经 Next rewrite 透传后会触发后端 CORS 校验而返回 403
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------- 可观测性（actuator） ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# ---------- 数据源 ----------
# 连接参数均支持环境变量覆盖（DB_URL / DB_USERNAME / DB_PASSWORD），默认本机回退
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/langchain4j?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# ---------- 日志级别 ----------
logging.level.root=INFO
logging.level.org.example=INFO
logging.level.dev.langchain4j=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
