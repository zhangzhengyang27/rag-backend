# RAG 知识库后端（rag-knowledge-hub）：
#   前端容器经 kbnet 直连 http://rag-backend:8081（next rewrites 代理，公网无需 frp）
#   MySQL 复用 dev-stack_devnet 的 dev-mysql（appuser@langchain4j 库）
#   Redis Stack（RediSearch 向量+BM25）= kb-redis-stack（同 kbnet）
#   docs 只读挂载自 tech-codex（KB_DOCS_ROOT=/docs，docs-sync 对账用）
#   重排模型挂载 /models（bge-reranker-base-int8 ONNX）
name: rag-backend
services:
  rag-backend:
    build: .
    container_name: rag-backend
    env_file: .env
    environment:
      KB_REDIS_HOST: kb-redis-stack
      KB_REDIS_PORT: "6379"
      KB_DOCS_ROOT: /docs
      KB_RERANK_MODEL_PATH: /models/bge-reranker-base-int8/model_quantized.onnx
      KB_RERANK_TOKENIZER_PATH: /models/bge-reranker-base-int8/tokenizer.json
      CORS_ALLOWED_ORIGINS: https://docs.zhangzhengyang.com
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    ports:
      - "127.0.0.1:18080:8081"   # 仅 NAS 本机调试（8081 被 dev-adminer 占用）
    volumes:
      - /volume1/docker/tech-codex/docs:/docs:ro
      - /volume1/docker/rag-backend/models:/models:ro
    networks: [kbnet, dev-stack_devnet]
    restart: unless-stopped
    mem_limit: 3g
networks:
  kbnet:
    external: true
  dev-stack_devnet:
    external: true
